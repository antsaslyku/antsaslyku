<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="1100" height="320" role="img" aria-labelledby="title desc">
  <title id="title">antsaslyku  software engineer</title>
  <desc id="desc">Software engineer specialised in blockchain, web3, and on-chain markets.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9a35a"/>
      <stop offset="1" stop-color="#e8d48b"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#d4af37" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fde68a"/>
      <stop offset="0.58" stop-color="#d4af37" stop-opacity="0"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;1;-1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2;0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.83  0 0 0 0 0.68  0 0 0 0 0.35  0 0 0 0.035 0" in="n"/>
    </filter>
  </defs>

  <rect width="1100" height="320" fill="#0b0b0a"/>
  <rect width="1100" height="320" filter="url(#grain)" opacity="0.9"/>

  <!-- frame -->
  <rect x="18" y="18" width="1064" height="284" fill="none" stroke="#d4af37" stroke-opacity="0.35" stroke-width="1"/>
  <rect x="22" y="22" width="1056" height="276" fill="none" stroke="#d4af37" stroke-opacity="0.18" stroke-width="1"/>

  <!-- corner brackets -->
  <path d="M40 64 V40 H64" fill="none" stroke="#d4af37" stroke-width="1.25"/>
  <path d="M1060 64 V40 H1036" fill="none" stroke="#d4af37" stroke-width="1.25"/>
  <path d="M40 256 V280 H64" fill="none" stroke="#d4af37" stroke-width="1.25"/>
  <path d="M1060 256 V280 H1036" fill="none" stroke="#d4af37" stroke-width="1.25"/>

  <!-- spine -->
  <rect x="40" y="86" width="2" height="148" fill="url(#fade)"/>

  <text x="52" y="58" fill="#d4af37" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="3.2">SOFTWARE ENGINEER</text>
  <text x="1048" y="58" text-anchor="end" fill="#d4af37" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="3.2">EST. PROFILE</text>

  <line x1="52" y1="72" x2="1048" y2="72" stroke="#d4af37" stroke-opacity="0.22" stroke-width="1"/>

  <text x="56" y="148" fill="#f4efe4" font-family="Georgia, 'Times New Roman', Times, serif" font-size="54" font-style="italic">antsaslyku</text>
  <text x="56" y="148" fill="url(#shimmer)" font-family="Georgia, 'Times New Roman', Times, serif" font-size="54" font-style="italic">antsaslyku</text>

  <text x="58" y="182" fill="#c9a35a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2.4">BLOCKCHAIN  ·  WEB3  ·  ON-CHAIN MARKETS</text>

  <text x="58" y="226" fill="#b8b0a4" font-family="Georgia, 'Times New Roman', Times, serif" font-size="16" font-style="italic">Manual is a prototype. Automation is the product.</text>

  <line x1="52" y1="248" x2="1048" y2="248" stroke="#d4af37" stroke-opacity="0.22" stroke-width="1"/>

  <text x="58" y="276" fill="#d4af37" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2.6">POLYMARKET</text>
  <text x="198" y="276" fill="#6e685e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">’</text>
  <text x="228" y="276" fill="#d4af37" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2.6">PERPS</text>
  <text x="318" y="276" fill="#6e685e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">’</text>
  <text x="348" y="276" fill="#d4af37" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2.6">ROBINHOOD CHAIN</text>
  <text x="1048" y="276" text-anchor="end" fill="#6e685e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.8">AUTOMATION FIRST</text>
</svg>
